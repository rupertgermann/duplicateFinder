[package]
name = "duplicate-finder"
version = "1.0.7"
edition = "2021"

[lib]
name = "duplicate_finder_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
md-5 = "0.10"
rayon = "1.10"
walkdir = "2"
dunce = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff", "webp", "ico"] }
base64 = "0.22"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
jiff = { version = "1", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
percent-encoding = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["NSError", "NSFileManager", "NSPathUtilities", "NSString", "NSURL"] }

[target.'cfg(windows)'.dependencies]
trash = "5"
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_SystemServices"] }
